dth:100%;text-align:left;background:#fff;border:1px solid #dbe2ea;padding:13px;border-radius:12px;margin:6px 0}.opt.sel{border-color:#2563eb;background:#eff6ff}.opt.ok{border-color:#16a34a;background:#f0fdf4}.opt.bad{border-color:#dc2626;background:#fef2f2}.explain{background:#f8fafc;padding:13px;border-radius:11px;margin-top:13px;line-height:1.6}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:#2563eb}footer{text-align:center;color:#94a3b8;font-size:12px;padding:28px 15px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero h1{font-size:25px}.qtext{font-size:18px}header{padding:11px 12px}nav button{padding:7px 6px}main{padding:11px}}</style></head><body><div class="app"><header><div class="brand">🧭 导游证备考助手</div><nav id="nav"></nav></header><main id="app"></main><footer>V2 原创练习题演示版 · 不代表官方考试题库</footer></div><script>

['全国导游基础知识','旅游资源','山岳景观属于自然旅游资源。',['正确','错误'],0,'山岳景观属于典型自然旅游资源。'],

['地方导游基础知识','广东文化','岭南建筑、园林和饮食都可以成为地方导游讲解素材。',['正确','错误'],0,'这些内容都能体现岭南地域文化特色。']
].map((x,i)=>({id:i+1,subject:x[0],chapter:x[1],q:x[2],options:x[3],answer:x[4],explain:x[5],type:x[3].length==2?'判断题':'单选题'}));
const subs=['全部','政策与法律法规','导游业务','全国导游基础知识','地方导游基础知识'];const KEY='tourGuideExamV2';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{a:0,c:0,wrong:[],fav:[],stats:{}};let view='home',pool=[],i=0,sel=null,done=false,mode='practice';
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),rate=()=>S.a?Math.round(S.c/S.a*100):0;
function go(v){view=v;render()}function nav(){navEl.innerHTML=['home:首页','practice:练习','wrong:错题本','stats:统计'].map(z=>{let[a,b]=z.split(':');return `<button class="${view==a?'on':''}" onclick="go('${a}')">${b}</button>`}).join('')};const navEl=document.getElementById('nav'),app=document.getElementById('app');
function home(){app.innerHTML=`<section class=hero><h1>导游证备考助手 V2</h1><p>四科练习 · 章节刷题 · 错题收藏 · 模拟考试 · 学习统计</p><div class=stats><div class=stat><b>${S.a}</b>累计作答</div><div class=stat><b>${S.c}</b>答对题数</div><div class=stat><b>${rate()}%</b>总体正确率</div><div class=stat><b>${S.wrong.length}</b>错题数量</div></div></section><div class="card"><h2>四科练习</h2><div class=grid>${subs.slice(1).map((s,n)=>`<div class=card><div style="font-size:27px">${['⚖️','🧭','🏛️','🌏'][n]}</div><h3>${s}</h3><p class=muted>${Q.filter(q=>q.subject==s).length} 道演示题</p><button class=primary onclick="startSub('${s}')">开始练习</button></div>`).join('')}</div></div><br><div class=grid><div class=card><h3>🎯 模拟考试</h3><p class=muted>随机抽取 20 题</p><button class=secondary onclick=startExam()>开始模拟</button></div><div class=card><h3>⭐ 我的收藏</h3><p class=muted>${S.fav.length} 道收藏</p><button class=secondary onclick=startFav()>练习收藏</button></div></div>`}
function startSub(s){pool=Q.filter(q=>q.subject==s);mode='practice';i=0;sel=null;done=false;view='practice';render()}function startFav(){pool=Q.filter(q=>S.fav.includes(q.id));mode='practice';i=0;sel=null;done=false;view='practice';render()}function startExam(){pool=[...Q].sort(()=>Math.random()-.5).slice(0,20);mode='exam';i=0;sel=null;done=false;view='practice';render()}
function practice(){if(!pool.length){app.innerHTML='<div class=card><h2>暂无题目</h2><button class=primary onclick="go(\'home\')">返回首页</button></div>';return}let q=pool[i];app.innerHTML=`<div class="actions"><button class=secondary onclick="go('home')">← 首页</button><span class=muted>${mode==='exam'?'模拟考试':'章节练习'} · ${i+1}/${pool.length}</span></div><div class=progress><i style="width:${i/pool.length*100}%"></i></div><div class=question><span class=tag>${q.subject}</span><span class=tag>${q.chapter}</span><span class=tag>${q.type}</span><div class=qtext>${q.q}</div>${q.options.map((o,n)=>`<button class="opt ${done?(n===q.answer?'ok':n===sel?'bad':''):n===sel?'sel':''}" ${done?'disabled':''} onclick="pick(${n})">${String.fromCharCode(65+n)}. ${o}</button>`).join('')}<div class=actions>${done?`<button class=primary onclick=next()>${i<pool.length-1?'下一题':'完成练习'}</button>`:`<button class=primary onclick=submit()>提交答案</button>`}<button class=secondary onclick=fav()>${S.fav.includes(q.id)?'⭐ 已收藏':'☆ 收藏'}</button></div>${done?`<div class=explain><b>${sel===q.answer?'✅ 回答正确':'❌ 回答错误'}</b><br>${q.explain}</div>`:''}</div>`}
function pick(n){if(!done){sel=n;render()}}function submit(){if(sel===null){alert('请先选择答案');return}let q=pool[i],ok=sel===q.answer;S.a++;if(ok)S.c++;S.stats[q.subject]??={a:0,c:0};S.stats[q.subject].a++;if(ok)S.stats[q.subject].c++;if(!ok&&!S.wrong.includes(q.id))S.wrong.push(q.id);save();done=true;render()}function next(){if(i<pool.length-1){i++;sel=null;done=false;render()}else{alert('本轮练习完成！');go('home')}}function fav(){let id=pool[i].id,p=S.fav.indexOf(id);p>=0?S.fav.splice(p,1):S.fav.push(id);save();render()}
function wrong(){let qs=Q.filter(q=>S.wrong.includes(q.id));app.innerHTML=`<div class=actions><h2 style="margin-right:auto">❌ 错题本（${qs.length}）</h2>${qs.length?'<button class=primary onclick=startWrong()>开始错题练习</button><button class=danger onclick=clearWrong()>清空</button>':''}</div><div class=grid>${qs.length?qs.map(q=>`<div class=wrong><b>${q.q}</b><p class=muted>${q.subject} · ${q.chapter}</p><p>答案：${q.options[q.answer]}</p></div>`).join(''):'<div class=card><h3>🎉 暂无错题</h3><p class=muted>做题后系统会自动记录错题。</p></div>'}</div>`}function startWrong(){pool=Q.filter(q=>S.wrong.includes(q.id));mode='practice';i=0;sel=null;done=false;view='practice';render()}function clearWrong(){if(confirm('确定清空错题本吗？')){S.wrong=[];save();render()}}
function stats(){app.innerHTML=`<h2>📊 学习统计</h2><div class=grid>${subs.slice(1).map(s=>{let x=S.stats[s]||{a:0,c:0};let p=x.a?Math.round(x.c/x.a*100):0;return `<div class=card><h3>${s}</h3><p>作答 ${x.a} · 正确 ${x.c}</p><div class=progress><i style="width:${p}%"></i></div><b>${p}%</b></div>`}).join('')}</div><br><div class=card><h3>总览</h3><p>累计作答：${S.a}</p><p>答对题数：${S.c}</p><p>总体正确率：${rate()}%</p><p>错题：${S.wrong.length} · 收藏：${S.fav.length}</p></div>`}
function render(){nav();view==='home'?home():view==='practice'?practice():view==='wrong'?wrong():stats()}render();
</script></body></html>
